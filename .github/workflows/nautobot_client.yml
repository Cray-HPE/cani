name: Nautobot Client

on:
  push:
    paths:
      - '.github/workflows/nautobot_client.yml'
      - 'Makefile'
      - 'internal/openapi/**'
      - 'pkg/nautobot/nautobot_api.go'
      - 'testdata/fixtures/nautobot/**'
  pull_request:
    paths:
      - '.github/workflows/nautobot_client.yml'
      - 'Makefile'
      - 'internal/openapi/**'
      - 'pkg/nautobot/nautobot_api.go'
      - 'testdata/fixtures/nautobot/**'
  workflow_dispatch:

jobs:
  generated-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Start pinned Nautobot client source
        run: make nautobot-ci-up

      - name: Check generated client
        run: make nautobot_client_check

      - name: Show Nautobot diagnostics
        if: failure()
        run: |
          docker compose $NAUTOBOT_COMPOSE ps -a
          docker compose $NAUTOBOT_COMPOSE logs --no-color --tail=200 db redis nautobot
        env:
          NAUTOBOT_COMPOSE: >-
            -f testdata/fixtures/nautobot/docker-compose.postgres.yml
            -f testdata/fixtures/nautobot/docker-compose.base.yml
            -f testdata/fixtures/nautobot/docker-compose.local.yml

      - name: Stop Nautobot simulator
        if: always()
        run: make nautobot-down