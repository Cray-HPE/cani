name: Nautobot Client

on:
  push:
    paths:
      - '.github/workflows/nautobot_client.yml'
      - 'Makefile'
      - 'internal/openapi/**'
      - 'pkg/nautobot/nautobot_api.go'
      - 'testdata/fixtures/nautobot/**'
  pull_request:
    paths:
      - '.github/workflows/nautobot_client.yml'
      - 'Makefile'
      - 'internal/openapi/**'
      - 'pkg/nautobot/nautobot_api.go'
      - 'testdata/fixtures/nautobot/**'
  workflow_dispatch:

jobs:
  generated-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Start pinned Nautobot simulator
        run: make nautobot-up

      - name: Wait for Nautobot API
        shell: bash
        run: |
          token=$(sed -n 's/^NAUTOBOT_SUPERUSER_API_TOKEN=//p' testdata/fixtures/nautobot/env/creds.env)
          for attempt in {1..60}; do
            if curl -sSf -H "Authorization: Token $token" http://localhost:8081/api/status/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Nautobot API did not become ready" >&2
          exit 1

      - name: Check generated client
        run: make nautobot_client_check

      - name: Stop Nautobot simulator
        if: always()
        run: make nautobot-down