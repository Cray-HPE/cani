---
x-nautobot-base: &nautobot-base
  image: "networktocode/nautobot:${NAUTOBOT_VERSION:-3.0}-py${PYTHON_VER:-3.12}"
  env_file:
    - "env/local.env"
    - "env/creds.env"
  tty: true

services:
  nautobot:
    mem_limit: 2g
    depends_on:
      db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    <<: *nautobot-base
  celery_worker:
    mem_limit: 1g
    entrypoint:
      - "sh"
      - "-c"  # this is to evaluate the $NAUTOBOT_LOG_LEVEL from the env
      - "nautobot-server celery worker -l $$NAUTOBOT_LOG_LEVEL --events --concurrency=2"  ## $$ because of docker-compose
    depends_on:
      nautobot:
        condition: "service_healthy"
    healthcheck:
      interval: "30s"
      timeout: "10s"
      start_period: "30s"
      retries: 3
      test:
        [
          "CMD",
          "bash",
          "-c",
          "nautobot-server celery inspect ping --destination celery@$$HOSTNAME"  ## $$ because of docker-compose
        ]
    <<: *nautobot-base
  celery_beat:
    mem_limit: 768m
    entrypoint:
      - "sh"
      - "-c"  # this is to evaluate the $NAUTOBOT_LOG_LEVEL from the env
      - "nautobot-server celery beat -l $$NAUTOBOT_LOG_LEVEL"  ## $$ because of docker-compose
    depends_on:
      nautobot:
        condition: "service_healthy"
    healthcheck:
      disable: true
    <<: *nautobot-base
  redis:
    image: "valkey/valkey:7-trixie"
    mem_limit: 256m
    command:
      - "sh"
      - "-c"  # this is to evaluate the $NAUTOBOT_REDIS_PASSWORD from the env
      - "redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction --requirepass $$NAUTOBOT_REDIS_PASSWORD"
    env_file:
      - "env/local.env"
      - "env/creds.env"
    healthcheck:
      interval: "5s"
      timeout: "5s"
      retries: 20
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$NAUTOBOT_REDIS_PASSWORD valkey-cli ping | grep -q PONG"]
