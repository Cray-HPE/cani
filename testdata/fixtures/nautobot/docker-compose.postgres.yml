---
services:
  db:
    image: "postgres:18-alpine"
    mem_limit: 512m
    env_file:
      - "env/local.env"
      - "env/creds.env"
    command:
      - "-c"
      - "max_connections=200"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"
      interval: "10s"
      timeout: "5s"
      retries: 10

volumes:
  postgres_data: {}
