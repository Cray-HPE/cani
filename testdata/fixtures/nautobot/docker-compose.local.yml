---
services:
  nautobot:
    command: "nautobot-server runserver 0.0.0.0:8081"
    ports:
      - "8081:8081"
    volumes:
      - "./config/nautobot_config.py:/opt/nautobot/nautobot_config.py"
      - "./jobs:/opt/nautobot/jobs"
    healthcheck:
      interval: "10s"
      timeout: "5s"
      start_period: "60s"
      retries: 60
      test:
        - "CMD-SHELL"
        - >-
          python -c 'import os, urllib.request;
          request = urllib.request.Request("http://localhost:8081/api/status/",
          headers={"Authorization": "Token " + os.environ["NAUTOBOT_SUPERUSER_API_TOKEN"]});
          urllib.request.urlopen(request, timeout=5).read()'
  celery_worker:
    volumes:
      - "./config/nautobot_config.py:/opt/nautobot/nautobot_config.py"
      - "./jobs:/opt/nautobot/jobs"
